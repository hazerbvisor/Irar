workflows:
  ios-unsigned:
    name: Irar — iOS IPA for sideloading
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Validate project inputs
        script: |
          set -euo pipefail
          plutil -lint Irar/Info.plist Irar.xcodeproj/project.pbxproj
          xcodebuild -list -project Irar.xcodeproj
          bash -n scripts/build-libarchive.sh scripts/package-ipa.sh
      - name: Test archive extraction and file storage
        script: |
          set -euo pipefail
          bash tests/run-tests.sh
      - name: Build iPhone and iPad app
        script: |
          set -euo pipefail
          xcodebuild -project Irar.xcodeproj -scheme Irar -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO build
      - name: Package IPA
        script: |
          set -euo pipefail
          bash scripts/package-ipa.sh
    artifacts:
      - build/Irar-unsigned.ipa
      - build/DerivedData/Build/Products/Release-iphoneos/Irar.app
